plugins {
    alias(libs.plugins.android.application)
}
def getIpAddress() {
    Properties properties = new Properties()
    properties.load(project.rootProject.file('local.properties').newDataInputStream())
    return properties.getProperty('ip_addr')
}

def getJwtSecret() {
    Properties properties = new Properties()
    properties.load(project.rootProject.file('local.properties').newDataInputStream())
    return properties.getProperty('jwt_secret')
}

android {
    namespace 'rs.ac.uns.eventplanner.team7'
    compileSdk 34

    defaultConfig {
        applicationId "rs.ac.uns.eventplanner.team7"
        minSdk 34
        targetSdk 34
        versionCode 1
        versionName "1.0"
        android.buildFeatures.buildConfig true
        buildConfigField "String", "IP_ADDR", "\"" + getIpAddress()+"\""
        buildConfigField "String", "JWT_SECRET", "\"" + getJwtSecret()+"\""
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    buildFeatures {
        viewBinding true
    }
}

dependencies {

    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core
    annotationProcessor libs.lombok
